; ESP32-C3 Super Mini + GC9A01 圆屏
[env:esp32-c3-supermini]
; Arduino-ESP32 3.3.11 + ESP-IDF 5.5.5。固定版本，避免 stable 漂移。
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
platform_packages =
  framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz
  framework-arduinoespressif32-libs@https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11-libs.tar.xz
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
extra_scripts = post:tools/check_main_size.py
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  lovyan03/LovyanGFX @ ^1.2.0
  bblanchon/ArduinoJson @ ^7.2.0
  bitbank2/AnimatedGIF @ 2.2.3
